<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스킬스북도서관</title>
    <link rel="stylesheet" href="css/wrap.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/slider.css">
</head>
<body>
    <div id="wrap">
        <!-- 모달창 -->
        <input type="checkbox" name="checkbox" id="modal-check" checked>
        <div class="modal-box">
            <div class="modal">
                <div class="img-box">
                    <img src="images/images (95).jpg" alt="모달창" title="지방기능경기대회">
                    <label for="modal-check" class="close">+</label>
                </div>
                <h3>2025년 지방기능경기대회 <br> 참가원서 접수 공고사항을 아래 같이 알려드립니다.</h3>
                <br>
                <p>□ 접수기간 : 2025. 1. 13.(월) ～ 1. 24.(금) 18:00 마감 [12일간] <br> □ 대상직종 : 웹디자인및개발 등 48개 직종 <br> □ 접수방법 : 마이스터넷 홈페이지 인터넷 접수</p>
            </div>
        </div>
        <!-- 모달창 -->

        <!-- 헤더 -->
        <header>
            <div class="logo">
                <img src="" alt="">
                <p>스킬스북도서관</p>
            </div>

            <nav>
                <div class="nav-box" tabindex="0">
                    <div class="main-box">
                        <p>도서관소개</p>
                        <div class="icon">
                            <div class="btn-w"></div>
                            <div class="btn-h"></div>
                        </div>
                    </div>
                    <div class="sub-box">
                        <p>도서관소개</p>
                        <p>도서관현황</p>
                    </div>
                </div>
                <div class="nav-box" tabindex="0">
                    <div class="main-box">
                        <p>도서자료실</p>
                        <div class="icon">
                            <div class="btn-w"></div>
                            <div class="btn-h"></div>
                        </div>
                    </div>
                    <div class="sub-box">
                        <p>자료실</p>
                        <p>열람실예약</p>
                    </div>
                </div>
                <div class="nav-box" tabindex="0">
                    <div class="main-box">
                        <p>회원서비스</p>
                        <div class="icon">
                            <div class="btn-w"></div>
                            <div class="btn-h"></div>
                        </div>
                    </div>
                    <div class="sub-box">
                        <p>회원가입</p>
                        <p>마이페이지</p>
                    </div>
                </div>
                <div class="nav-box"><a href="#">신규도서등록</a></div>
                <div class="nav-box"><a href="#">대출/열람실 업무조회</a></div>
            </nav>

            <div class="login">
                
            </div>
        </header>
        <!-- 헤더 -->
        <!-- 슬라이더 -->
        <div class="slider-wrap">
            <div class="slider">
                <div class="slider-img"><img src="images/images (51).jpg" alt=""></div>
                <div class="slider-img"><img src="images/images (53).jpg" alt=""></div>
                <div class="slider-img"><img src="images/images (41).jpg" alt=""></div>
                <div class="slider-img"><img src="images/images (51).jpg" alt=""></div>
            </div>
            <div class="play-bar">
                <div class="bar">
                    <div class="color"></div>
                </div>
            </div>
        </div>
        <!-- 슬라이더 -->
    </div>
</body>
</html>
