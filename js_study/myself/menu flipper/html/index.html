<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>menu flipper</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="modal">
        <div class="modal-box">
            <h2>나만의 메뉴판 관리</h2>
            
            <div class="input-box">
                <input type="text" id="menu-input" placeholder="추가할 메뉴 입력">
                <button id="btn-add">추가</button>
            </div>
            
            <ul class="list"></ul>
        </div>
    </div>

    <div class="box">
        <div class="text-box">
            <h1>오늘의 메뉴는 <span class="menu">이것</span>입니다!</h1>
        </div>
        <div class="btn-container">
            <button id="btn-roll" class="btn-roll">roll</button>
            <button id="btn-list" class="btn-list">list</button>
            <button id="btn-custom" class="btn-custom">custom</button>
        </div>
    </div>
</body>
<script src="../js/script.js"></script>
</html>
