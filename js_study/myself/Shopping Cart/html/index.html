<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장바구니</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="box">
        <div id="item">
            <div class="item1">
                <div id="product">
                    <div class="pruduct-img"><img src="../img/ishmael.png" alt=""></div>
                    <div class="product-info"><span id="product-name">나만의 항해방식</span><span id="price">12000원</span></div>
                </div>
                <div id="btn">
                    <button class="btn inc">+</button>
                    <span id="count-1">1</span>
                    <button class="btn dec">-</button>
                </div>
            </div>
        </div>
        <div id="cost">
            <div class="total"><span id="total"></span></div>
        </div>
    </div>
</body>
<script src="../js/script.js"></script>
