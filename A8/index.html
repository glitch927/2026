<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="wrap">
        <div class="title">
            <h1>장바구니</h1>
        </div>
        <div class="product">
            <div class="box">
                <img src="images/tshirt.jpg" alt="">
                <div class="text">
                    <span>WorldSkills 공식 티셔츠</span><br><br>
                    <p>색상: 네이비</p>
                    <p>사이즈: L</p>
                </div>
                <div class="count">
                    <button class="minus">-</button>
                    <p>2</p>
                    <button class="plus">+</button>
                    <p>25,000원</p>
                    <div class="cancle">×</div>
                </div>
            </div>
            <div class="box">
                <img src="images/book.jpg" alt="">
                <div class="text">
                    <span>기능경기 가이드북</span><br><br>
                    <p>종류: 웹디자인</p>
                    <p>2026년 최신판</p>
                </div>
                <div class="count">
                    <button class="minus">-</button>
                    <p>1</p>
                    <button class="plus">+</button>
                    <p>15,000원</p>
                    <div class="cancle">×</div>
                </div>
            </div>
            <div class="box">
                <img src="images/laptop-case.jpg" alt="">
                <div class="text">
                    <span>WorldSkills 노트북 파우치</span><br><br>
                    <p>색상: 블랙</p>
                    <p>15인치 호환</p>
                </div>
                <div class="count">
                    <button class="minus">-</button>
                    <p>1</p>
                    <button class="plus">+</button>
                    <p>35,000원</p>
                    <div class="cancle">×</div>
                </div>
            </div>
        </div>
        <div class="value">
            <div class="top">
                <p>상품금액</p>
                <p class="right">75,000원</p>
                <p>배송비</p>
                <p class="right">3,000원</p>
            </div>
            <div class="bottom">
                <p>총 결제금액</p><p>78,000원</p>
            </div>
        </div>
        <div class="button">
            <button class="continue">쇼핑 계속하기</button>
            <button class="buy">주문하기</button>
        </div>
    </div>
</body>
</html>
