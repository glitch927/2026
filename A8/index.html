<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A8</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="wrap">
        <div class="box">
            <div class="box2">
                <div class="basket-title"><h1>장바구니</h1></div>

                <div class="product">
                    <div class="img-box"><img src="image/tshirt.jpg" alt="티셔츠" width="100px"></div>
                    <div class="text-box">
                        <p class="product-title">WorldSkills 공식 티셔츠</p>
                        <p class="product-sub">색상: 네이비</p>
                        <p class="product-addex">사이즈: L</p>
                    </div>
                    <div class="text-box2">
                        <p class="miuns">-</p>
                        <p class="number">2</p>
                        <p class="add">+</p>
                        <p class="price">25,000원</p>
                        <p class="cencle">×</p>
                    </div>
                </div>

                <div class="product">
                    <div class="img-box"><img src="image/book.jpg" alt="책" width="100px"></div>
                    <div class="text-box">
                        <p class="product-title">기능경기 가이드북</p>
                        <p class="product-sub">종류: 웹디자인</p>
                        <p class="product-addex">2026년 최신판</p>
                    </div>
                    <div class="text-box2">
                        <p class="miuns">-</p>
                        <p class="number">1</p>
                        <p class="add">+</p>
                        <p class="price">15,000원</p>
                        <p class="cencle">×</p>
                    </div>
                </div>

                <div class="product">
                    <div class="img-box"><img src="image/laptop-case.jpg" alt="가방" width="100px"></div>
                    <div class="text-box">
                        <p class="product-title">WorldSkills 노트북 파우치</p>
                        <p class="product-sub">색상: 블랙</p>
                        <p class="product-addex">15인치 호환</p>
                    </div>
                    <div class="text-box2">
                        <p class="miuns">-</p>
                        <p class="number">1</p>
                        <p class="add">+</p>
                        <p class="price">35,000원</p>
                        <p class="cencle">×</p>
                    </div>
                </div>

                <div class="cost">
                    <div class="product-cost">
                        <p class="product-cost1">상품금액</p>
                        <p class="product-cost2">75,000원</p>
                    </div>
                    <div class="deli-price">
                        <p class="deli-price1">배송비</p>
                        <p class="deli-price2">3,000원</p>                        
                    </div>
                    <div class="total-cost">
                        <p class="total-cost-text">총 결제금액</p>
                        <p class="total-cost1">78,000원</p>
                    </div>
                </div>

                <div class="button">
                    <div class="more-button">쇼핑 계속하기</div>
                    <div class="finish-button">주문하기</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
