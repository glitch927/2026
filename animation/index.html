<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation</title>
    <link rel="stylesheet" href="default.css">
    <link rel="stylesheet" href="stick.css">
    <link rel="stylesheet" href="circle.css">
    <link rel="stylesheet" href="arrow.css">
    <link rel="stylesheet" href="seesaw.css">
</head>
<body>
    <div id="wrap">
        <div class="stick"></div>
        <div class="stick"></div>
        <div class="stick"></div>
        <div class="stick"></div>
        <div class="stick"></div>
        <div class="stick"></div>
        <div class="stick"></div>
        <div class="stick"></div>
        <div class="stick"></div>
        <div class="stick"></div>
        <!-- stick (1~10, 10) -->
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="border-circle">
            <div class="circle"></div>
        </div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <!-- circle (11~22, 12) -->
        <div class="arrow"></div>
        <div class="arrow"></div>
        <div class="arrow"></div>
        <div class="arrow"></div>
        <div class="arrow"></div>
        <div class="arrow"></div>
        <div class="arrow"></div>
        <div class="arrow"></div>
        <div class="arrow"></div>
        <div class="arrow"></div>
        <div class="arrow"></div>
        <div class="arrow"></div>
        <!-- arrow (23~34, 12) -->
        <div class="circle"></div>
        <div class="stick"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="stick"></div>
        <div class="circle end"></div>
        <!-- seesaw (35~40, 6) -->
    </div>
</body>
<script src="script.js"></script>
</html>
