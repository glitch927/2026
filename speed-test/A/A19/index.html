<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A19</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="radio" name="card" id="card1" checked>
    <input type="radio" name="card" id="card2">
    <input type="radio" name="card" id="card3">
    <div class="container">
        <div class="card c1">1</div>
        <div class="card c2">2</div>
        <div class="card c3">3</div>
    </div>
    <div class="controller">
        <label for="card2" class="next btn1">다음</label>

        <label for="card1" class="prev btn2">이전</label>
        <label for="card3" class="next btn2">다음</label>

        <label for="card2" class="prev btn3">이전</label>
    </div>
</body>
</html>
