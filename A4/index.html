<body>
    <div id="wrap">
        <div class="box">
            <h2>회원가입</h2>
            <input type="text" name="name" id="name" required placeholder="이름을 입력하세요">
            <input type="email" name="email" id="email" required placeholder="이메일을 입력하세요">
            <input type="password" name="password" id="password" required placeholder="비밀번호를 입력하세요" >
            <input type="password" name="password" id="check" required placeholder="비밀번호를 확인하세요">
            <div class="box2">
                <p>가입하기</p>
            </div>
        </div>
    </div>
