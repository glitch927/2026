<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A13</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="wrap">
        <a href="#modal" class="box">로그인</a>

        <div id="modal">
            <div class="close-bar">
                <a href="#" class="close">X</a>
            </div>
            <div class="container">
                <div class="text-box">
                    <h2>계정 로그인</h2>
                    <p>안전한 서비스를 위해 로그인이 필요합니다.</p>
                    <br>
                    <p>계속하려면 아래에 등록된 이메일과 비밀번호를 입력해주세요.</p>
                </div>
                <div class="enter">
                    <div class="input">
                        <input type="email" name="이메일" id="email" placeholder="이메일을 입력하세요">
                        <input type="password" name="비밀번호" id="password" placeholder="비밀번호를 입력하세요">
                    </div>
                    <div class="button">
                        <div class="login">로그인 계속</div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
