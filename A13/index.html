<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="checkbox" name="login" id="login" hidden>
    <label for="login" class="open">로그인</label>
    <div class="modal">
        <div class="modal-popup">
            <label for="login" class="close">X</label>
            <p>계정 로그인</p><br>
            <p>안전한 서비스를 위해 로그인이 필요합니다.</p><br>
            <p>계속하려면 아래에 등록된 이메일과 비밀번호를 입력해주세요.</p>
            <input type="email" name="email" id="input-email" placeholder="이메일을 입략해주세요.">
            <input type="password" name="password" id="input-password" placeholder="비밀번호를 입략해주세요.">
            <button>로그인 계속</button>
        </div>
    </div>
</body>
</html>
